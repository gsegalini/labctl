[project]
name = "labctl"
version = "0.1.0"
description = "Run experiments under a thin supervisor and wake coding agents only on events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
labctl = "labctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labctl"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
