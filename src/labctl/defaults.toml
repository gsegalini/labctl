# Model per role tier and harness. Override any key in ~/.config/labctl/config.toml
# (same shape; set LABCTL_CONFIG to use another file). The user file wins per key.

[claude]
frontier = "fable"
strong = "opus"
cheap = "claude-haiku-5-5"

[codex]
# Taken from ~/.codex on the development machine: main model, implementer role,
# experimenter/operator roles.
frontier = "gpt-6-astra"
strong = "gpt-6.1-sol"
cheap = "gpt-6-luna"

[opencode]
# Defaults to adjust: check `opencode models` for the ids your providers offer.
frontier = "opencode-go/glm-5.3"
strong = "opencode-go/deepseek-v4.1-flash"
cheap = "opencode-go/mimo-v2.6-flash"
